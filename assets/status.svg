<svg xmlns="http://www.w3.org/2000/svg" width="432" height="36" viewBox="0 0 432 36" role="img" aria-label="Open to work: freelance and full-time. Based in Hyderabad, India." xmlns:c2pa="http://c2pa.org/manifest">
  <title>Open to work: freelance and full-time. Based in Hyderabad, India.</title>
  <style>
    .pulse{animation:pulse 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%{transform:scale(1);opacity:.75}100%{transform:scale(3.2);opacity:0}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.pulse,.blink{animation:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1e2e"/><stop offset="1" stop-color="#161722"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b57d0"/><stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b57d0"/><stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="432" cy="0" r="302" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
