    </linearGradient>
    <mask id="fade"><rect x="242" y="0" width="190" height="130" fill="url(#fadeg)"/></mask>
    <clipPath id="clip"><rect width="432" height="36" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="432" height="36" fill="url(#bg)"/>
    
    
<circle class="pulse" cx="22" cy="18" r="4.5" fill="#9ece6a"/>
